      'music-listening-dashboard.html': 'work/track-record.html',
      'resume.html': 'downloads/Taya-Dailey-Resume.pdf'
    };
    var path = location.pathname;
    var cut = path.lastIndexOf('/') + 1;
    var name;

      location.replace(path.slice(0, cut) + MOVED[name]);

  })();
